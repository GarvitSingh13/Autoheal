[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoheal"
version = "1.0.0"
description = "Autonomous Network Healing Platform: alarms -> root cause analysis -> automatic reconfiguration over NETCONF/REST, on a Kafka event bus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "ncclient>=0.6.15",
    "lxml>=5.0",
    "paramiko>=3.4",
    "networkx>=3.2",
    "aiokafka>=0.10",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
autoheal = "autoheal.cli:main"

[tool.setuptools.packages.find]
include = ["autoheal*", "simulator*"]

[tool.setuptools.package-data]
autoheal = ["api/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
